name: Deploy Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate clasp
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push code to GAS
        run: clasp push -f

      # Раскомментируйте шаг ниже, если проект — это Web App или API Executable
      # - name: Update deployment
      #   run: clasp deploy -i ${{ secrets.DEPLOYMENT_ID }} -d "Auto-deploy from GitHub"